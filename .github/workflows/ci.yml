name: ci

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  fir-regression:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openxiangshan/xs-env:stable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build gsim
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -j "$(nproc)" build-gsim
      - name: Run FIR regression tests
        run: |
          # Auto-discover and run all minimized FIR regression inputs in test/*.fir.
          # This currently includes the reproducer from issue #106.
          make FIR_TEST_TIMEOUT=2m fir-tests

  difftest:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openxiangshan/xs-env:stable
      options: ${{ matrix.dutName == 'minimal-xiangshan' && '--privileged --volume /mnt:/mnt' || '' }}
    strategy:
      fail-fast: false
      matrix:
        dutName: [ysyx3, rocket, small-boom, large-boom, minimal-xiangshan]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Enlarge swap
        if: matrix.dutName == 'minimal-xiangshan'
        run: |
          sudo fallocate -l 60G /mnt/swapfile2
          sudo chmod 600 /mnt/swapfile2
          sudo mkswap /mnt/swapfile2
          sudo swapon /mnt/swapfile2
      - name: Check & init resources
        run: |
          echo "nproc = `nproc`"
          free -h
          df -h
          verilator --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make init
      - name: Run ${{ matrix.dutName }} (difftest with verilator)
        run: |
          sed -i -e "s/--threads [^ ]*/--threads `nproc`/" Makefile
          make -j `nproc` diff dutName=${{ matrix.dutName }}


  bolt-ysyx3:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openxiangshan/xs-env:stable
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true
      - name: Check & init resources
        run: |
          echo "nproc = `nproc`"
          free -h
          df -h
          verilator --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make init
      - name: Run ysyx3 (with bolt)
        run: |
          sed -i -e "s/--threads [^ ]*/--threads `nproc`/" Makefile
          make -j `nproc` bolt dutName=ysyx3

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check if nix builds
        run: |
          nix build .#gsim
          nix build .#gsim-static
