name: build-and-release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build:
    name: Build gsim
    strategy:
      fail-fast: false
      matrix:
        llvm-version:
          - 21.1.8
          - 19.1.7
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo ENABLE_STATIC=true ./scripts/install-dependencies.sh

      - name: Install LLVM toolchain
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ matrix.llvm-version }}

      - name: Build gsim & verify
        run: |
          # Build
          make -j"$(nproc)" STATIC=1 build-gsim
          # Rename to include compiler / arch info
          GSIM_BIN=./build/gsim/gsim-clang${{ matrix.llvm-version }}-${{ runner.arch }}
          mv ./build/gsim/gsim $GSIM_BIN
          echo "GSIM_BIN=$GSIM_BIN" > $GITHUB_ENV
          # Verify fully static binary: ldd prints "not a dynamic executable" for static binaries
          ldd $GSIM_BIN 2>&1 | tee /dev/stderr | grep -q "not a dynamic executable"
          # Verify gsim runs and prints help message
          $GSIM_BIN -h >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gsim-clang${{ matrix.llvm-version }}-${{ runner.arch }}
          path: ${{ env.GSIM_BIN }}

  release:
    name: Release on master
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v8
        with:
          pattern: gsim-*
          merge-multiple: true

      - name: Set release info
        id: release_info
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          target_commitish: ${{ github.sha }}
          tag_name: master-${{ steps.release_info.outputs.date }}-${{ steps.release_info.outputs.sha }}
          name: gsim ${{ steps.release_info.outputs.date }} ${{ steps.release_info.outputs.sha }}
          body: ${{ github.event.head_commit.message }}
          files: |
            gsim*
